name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://occ:occ@127.0.0.1:5432/occ?schema=public
      TEST_DATABASE_URL: postgresql://occ:occ@127.0.0.1:5432/occ?schema=api_test
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: occ
          POSTGRES_PASSWORD: occ
          POSTGRES_DB: occ
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U occ -d occ"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @occ/api db:generate

      - name: DB baseline preflight
        run: pnpm db:baseline

      - name: Apply migrations preflight
        run: pnpm --filter @occ/api db:migrate:deploy

      - name: DB migration status preflight
        run: pnpm --filter @occ/api db:migrate:status

      - name: Build shared runtime package
        run: pnpm --filter @occ/shared build

      - name: API route tests
        run: pnpm --filter @occ/api test:routes

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Start production API
        run: |
          nohup pnpm --filter @occ/api exec tsx src/index.ts > /tmp/occ-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "OCC API failed to start" >&2
          cat /tmp/occ-api.log >&2 || true
          exit 1

      - name: System health preflight
        run: pnpm health:check

      - name: Smoke test runtime
        run: CI_SKIP_OPENCLAW_CHECKS=true pnpm test:smoke

      - name: Performance gate
        env:
          PERF_GATE_API_BASE: http://127.0.0.1:8787
          PERF_GATE_ROUNDS: 3
          PERF_GATE_P95_MS: 1200
          PERF_GATE_ADMIN_PASSWORD: Admin@123456
        run: pnpm verify:perf:gate

      - name: Optional single-project strict audit
        if: ${{ env.PROJECT_ID != '' }}
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          AUDIT_STRICT: "true"
          AUDIT_REQUIRE_HERMES: "true"
          AUDIT_REQUIRE_NON_SCRIPTED: "true"
        run: pnpm audit:single-project:strict
