name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/dev.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @occ/api db:generate

      - name: DB baseline preflight
        run: pnpm db:baseline

      - name: Apply migrations preflight
        run: pnpm --filter @occ/api db:migrate:deploy

      - name: DB migration status preflight
        run: pnpm --filter @occ/api db:migrate:status

      - name: Prepare route-test seed DB
        run: pnpm --filter @occ/api db:push

      - name: Normalize route-test seed DB path
        run: |
          mkdir -p apps/api/prisma
          if [ ! -f apps/api/prisma/dev.db ] && [ -f apps/api/prisma/prisma/dev.db ]; then
            cp apps/api/prisma/prisma/dev.db apps/api/prisma/dev.db
          fi
          if [ ! -f apps/api/prisma/dev.db ] && [ -f prisma/dev.db ]; then
            cp prisma/dev.db apps/api/prisma/dev.db
          fi
          if [ ! -f apps/api/prisma/dev.db ]; then
            echo "missing apps/api/prisma/dev.db" >&2
            ls -la apps/api/prisma >&2 || true
            ls -la prisma >&2 || true
            exit 1
          fi

      - name: API route tests
        run: pnpm --filter @occ/api test:routes

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Start production API
        run: |
          nohup node apps/api/dist/index.js > /tmp/occ-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "OCC API failed to start" >&2
          cat /tmp/occ-api.log >&2 || true
          exit 1

      - name: System health preflight
        run: pnpm health:check

      - name: Smoke test runtime
        run: pnpm test:smoke
