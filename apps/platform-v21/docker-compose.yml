services:
  postgres:
    image: ankane/pgvector:latest
    container_name: platform-v21-postgres
    environment:
      POSTGRES_DB: agent_platform_v21
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - platform_v21_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 8
    networks:
      - agent-network

  redis:
    image: redis:7-alpine
    container_name: platform-v21-redis
    volumes:
      - platform_v21_redis_data:/data
    networks:
      - agent-network

  agent-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platform-v21-app
    ports:
      - '8787:8787'
    environment:
      NODE_ENV: production
      PORT: 8787
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: agent_platform_v21
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      HERMES_ENABLED: true
      HERMES_MCP: http://hermes:3001/mcp
      HERMES_MCP_ENDPOINT: http://hermes:3001/mcp
      HERMES_FALLBACK_URL: http://hermes:3001/fallback
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      OPENCLAW_ENABLED: true
      OPENCLAW_API: http://openclaw:3002/api
      OPENCLAW_API_ENDPOINT: http://openclaw:3002/api
      STITCH_API: http://stitch:3010/stitch
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DB_MIGRATIONS_RUN: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      hermes:
        condition: service_started
      openclaw:
        condition: service_started
    volumes:
      - platform_v21_uploads:/app/uploads
    networks:
      - agent-network

  hermes:
    build:
      context: ./services/hermes
      dockerfile: Dockerfile.hermes
    container_name: platform-v21-hermes
    environment:
      HERMES_PORT: 3001
      PLATFORM_API_BASE: http://agent-platform:8787/api/v1
      PLATFORM_API_KEY: ${HERMES_API_KEY:-}
      PLATFORM_SYNC_ENABLED: true
      HERMES_SQLITE_PATH: /data/hermes/memory.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/mcp/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

  openclaw:
    build:
      context: ./services/agent-runtime-mock
      dockerfile: Dockerfile
    container_name: platform-v21-openclaw
    environment:
      SERVICE_ROLE: openclaw
      PORT: 3002
    ports:
      - '3002:3002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/api/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

  stitch:
    build:
      context: ./services/agent-runtime-mock
      dockerfile: Dockerfile
    container_name: platform-v21-stitch
    environment:
      SERVICE_ROLE: stitch
      PORT: 3010
    ports:
      - '3010:3010'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3010/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

volumes:
  platform_v21_postgres_data:
  platform_v21_redis_data:
  platform_v21_uploads:

networks:
  agent-network:
    name: agent-network
    driver: bridge
