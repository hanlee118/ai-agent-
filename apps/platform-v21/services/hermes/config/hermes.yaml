hermes:
  name: "hermes-agent-1"
  version: "2.1.0"
  host: "0.0.0.0"
  port: 3001

llm:
  provider: "openai"
  model: "gpt-4.1-mini"
  temperature: 0.2
  max_tokens: 3000

memory:
  sqlite_path: "/data/hermes/memory.db"
  max_export_items: 100

skills:
  library_path: "/data/hermes/skills"
  min_score_to_create: 7.0
  min_tool_calls_to_create: 5

platform:
  enabled: true
  api_base: "http://agent-platform:8787/api/v1"
  sync_interval_seconds: 3600
  request_timeout_seconds: 10

logging:
  level: "INFO"
